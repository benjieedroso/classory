<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classory — User Stories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50:  '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        sunny: {
                            300: '#fcd34d',
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                        },
                    },
                },
            },
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .story-checkbox:checked + span {
            text-decoration: line-through;
            color: #94a3b8;
        }
        .story-item {
            transition: all 0.2s ease;
        }
        .story-item:hover {
            transform: translateX(4px);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Header -->
    <div class="bg-gradient-to-r from-brand-700 via-brand-600 to-brand-800 relative overflow-hidden">
        <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(circle at 80% 20%, white 1.5px, transparent 1.5px); background-size: 26px 26px;"></div>
        <div class="absolute -top-20 -right-20 w-72 h-72 bg-sunny-400/20 rounded-full blur-3xl"></div>
        <div class="max-w-4xl mx-auto px-6 py-12 relative z-10">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-12 h-12 bg-sunny-400 rounded-xl flex items-center justify-center shadow-lg">
                    <svg class="w-6 h-6 text-brand-900" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/>
                    </svg>
                </div>
                <h1 class="text-3xl font-extrabold text-white">Classory</h1>
            </div>
            <h2 class="text-2xl font-bold text-white/90">User Stories</h2>
            <p class="text-brand-200 mt-1">Track your progress — checked items are saved in your browser.</p>

            <!-- Progress bar -->
            <div class="mt-6">
                <div class="flex items-center justify-between text-sm text-brand-200 mb-2">
                    <span id="progress-text">0 of 0 completed</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="w-full h-3 bg-white/20 rounded-full overflow-hidden">
                    <div id="progress-bar" class="h-full bg-sunny-400 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div class="max-w-4xl mx-auto px-6 py-6">
        <div class="flex flex-wrap items-center gap-3">
            <button onclick="filterStories('all')" id="filter-all" class="filter-btn px-4 py-2 rounded-lg text-sm font-semibold bg-brand-600 text-white transition">All</button>
            <button onclick="filterStories('auth')" id="filter-auth" class="filter-btn px-4 py-2 rounded-lg text-sm font-semibold bg-white text-slate-600 border border-slate-200 hover:border-brand-300 transition">Authentication</button>
            <button onclick="filterStories('student')" id="filter-student" class="filter-btn px-4 py-2 rounded-lg text-sm font-semibold bg-white text-slate-600 border border-slate-200 hover:border-brand-300 transition">Student</button>
            <button onclick="filterStories('teacher')" id="filter-teacher" class="filter-btn px-4 py-2 rounded-lg text-sm font-semibold bg-white text-slate-600 border border-slate-200 hover:border-brand-300 transition">Teacher</button>
            <button onclick="filterStories('general')" id="filter-general" class="filter-btn px-4 py-2 rounded-lg text-sm font-semibold bg-white text-slate-600 border border-slate-200 hover:border-brand-300 transition">General</button>
            <div class="flex-1"></div>
            <button onclick="resetAll()" class="px-4 py-2 rounded-lg text-sm font-semibold text-red-500 hover:bg-red-50 transition">Reset All</button>
        </div>
    </div>

    <!-- Stories -->
    <div class="max-w-4xl mx-auto px-6 pb-16 space-y-8" id="stories-container">

        <!-- Authentication -->
        <section data-category="auth">
            <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                <svg class="w-5 h-5 text-brand-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z"/>
                </svg>
                Authentication
            </h3>
            <div class="space-y-2">
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="auth-1" onchange="saveState()">
                    <span class="text-slate-700">As a user, I want to see a login screen when I visit the homepage</span>
                </label>
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="auth-2" onchange="saveState()">
                    <span class="text-slate-700">As a user, I want to navigate to the registration page from the login screen</span>
                </label>
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="auth-3" onchange="saveState()">
                    <span class="text-slate-700">As a user, I want to register as a student or teacher</span>
                </label>
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="auth-4" onchange="saveState()">
                    <span class="text-slate-700">As a user, I want to be redirected to the dashboard after logging in</span>
                </label>
            </div>
        </section>

        <!-- Student -->
        <section data-category="student">
            <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                <svg class="w-5 h-5 text-brand-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342M6.75 15a.75.75 0 100-1.5.75.75 0 000 1.5zm0 0v-3.675A55.378 55.378 0 0112 8.443m-7.007 11.55A5.981 5.981 0 006.75 15.75v-1.5"/>
                </svg>
                Student Stories
            </h3>
            <div class="space-y-2">
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="student-1" onchange="saveState()">
                    <span class="text-slate-700">As a student, I want to set up my profile with my first name, last name, section, and student ID after registering</span>
                </label>
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="student-2" onchange="saveState()">
                    <span class="text-slate-700">As a student, I want to see all classrooms I'm part of on the dashboard</span>
                </label>
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="student-3" onchange="saveState()">
                    <span class="text-slate-700">As a student, I want to click on a classroom to enter it</span>
                </label>
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="student-4" onchange="saveState()">
                    <span class="text-slate-700">As a student, I want to click the Test card to view my scores</span>
                </label>
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="student-5" onchange="saveState()">
                    <span class="text-slate-700">As a student, I want to see only my own scores (not other students' scores)</span>
                </label>
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="student-6" onchange="saveState()">
                    <span class="text-slate-700">As a student, I want to see my name, section, and a table of my test scores</span>
                </label>
            </div>
        </section>

        <!-- Teacher -->
        <section data-category="teacher">
            <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                <svg class="w-5 h-5 text-sunny-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
                </svg>
                Teacher Stories
            </h3>
            <div class="space-y-2">
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="teacher-1" onchange="saveState()">
                    <span class="text-slate-700">As a teacher, I want to set up my profile with my first name, last name, and department after registering</span>
                </label>
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="teacher-2" onchange="saveState()">
                    <span class="text-slate-700">As a teacher, I want to be prompted to create a classroom after registration</span>
                </label>
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="teacher-3" onchange="saveState()">
                    <span class="text-slate-700">As a teacher, I want to create a classroom with a name, description, subject, and grade level</span>
                </label>
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="teacher-4" onchange="saveState()">
                    <span class="text-slate-700">As a teacher, I want to import students from an Excel file when creating a classroom</span>
                </label>
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="teacher-5" onchange="saveState()">
                    <span class="text-slate-700">As a teacher, I want to see all classrooms I'm part of on the dashboard</span>
                </label>
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="teacher-6" onchange="saveState()">
                    <span class="text-slate-700">As a teacher, I want to click on a classroom to enter it</span>
                </label>
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="teacher-7" onchange="saveState()">
                    <span class="text-slate-700">As a teacher, I want to upload test scores via an Excel file</span>
                </label>
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="teacher-8" onchange="saveState()">
                    <span class="text-slate-700">As a teacher, I want to see a success notification after uploading scores</span>
                </label>
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="teacher-9" onchange="saveState()">
                    <span class="text-slate-700">As a teacher, I want to be redirected back to the classroom after uploading</span>
                </label>
            </div>
        </section>

        <!-- General -->
        <section data-category="general">
            <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                <svg class="w-5 h-5 text-brand-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9.53 16.122a3 3 0 00-5.78 1.128 2.25 2.25 0 01-2.4 2.245 4.5 4.5 0 008.4-2.245c0-.399-.078-.78-.22-1.128zm0 0a15.998 15.998 0 003.388-1.62m-5.043-.025a15.994 15.994 0 011.622-3.395m3.42 3.42a15.995 15.995 0 004.764-4.648l3.876-5.814a1.151 1.151 0 00-1.597-1.597L14.146 6.32a15.996 15.996 0 00-4.649 4.763m3.42 3.42a6.776 6.776 0 00-3.42-3.42"/>
                </svg>
                General
            </h3>
            <div class="space-y-2">
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="general-1" onchange="saveState()">
                    <span class="text-slate-700">As a user, I want a beautiful blue and yellow themed UI</span>
                </label>
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="general-2" onchange="saveState()">
                    <span class="text-slate-700">As a user, I want consistent navigation across all pages</span>
                </label>
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="general-3" onchange="saveState()">
                    <span class="text-slate-700">As a user, I want to log out and return to the login screen</span>
                </label>
            </div>
        </section>

        <!-- Future Enhancements -->
        <section data-category="future">
            <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                <svg class="w-5 h-5 text-sunny-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                Future Enhancements
            </h3>
            <div class="space-y-2">
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="future-1" onchange="saveState()">
                    <span class="text-slate-700">Add Django models (User, Classroom, Student, Test, Score)</span>
                </label>
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="future-2" onchange="saveState()">
                    <span class="text-slate-700">Implement real authentication with Django's auth system</span>
                </label>
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="future-3" onchange="saveState()">
                    <span class="text-slate-700">Parse uploaded Excel files with openpyxl or pandas</span>
                </label>
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="future-4" onchange="saveState()">
                    <span class="text-slate-700">Add real database queries replacing mock data</span>
                </label>
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="future-5" onchange="saveState()">
                    <span class="text-slate-700">Add student enrollment via classroom codes</span>
                </label>
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="future-6" onchange="saveState()">
                    <span class="text-slate-700">Add grade computation and analytics</span>
                </label>
                <label class="story-item flex items-start gap-3 p-4 bg-white rounded-xl border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                    <input type="checkbox" class="story-checkbox mt-1 w-5 h-5 rounded border-slate-300 text-brand-600 focus:ring-brand-500" data-story="future-7" onchange="saveState()">
                    <span class="text-slate-700">Add email notifications</span>
                </label>
            </div>
        </section>

    </div>

    <script>
        const STORAGE_KEY = 'classory-user-stories';

        // Load saved state from localStorage
        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const checkedIds = JSON.parse(saved);
                checkedIds.forEach(id => {
                    const checkbox = document.querySelector(`[data-story="${id}"]`);
                    if (checkbox) checkbox.checked = true;
                });
            }
            updateProgress();
        }

        // Save state to localStorage
        function saveState() {
            const checked = [];
            document.querySelectorAll('.story-checkbox:checked').forEach(cb => {
                checked.push(cb.dataset.story);
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(checked));
            updateProgress();
        }

        // Update progress bar
        function updateProgress() {
            const all = document.querySelectorAll('.story-checkbox');
            const checked = document.querySelectorAll('.story-checkbox:checked');
            const total = all.length;
            const done = checked.length;
            const percent = total > 0 ? Math.round((done / total) * 100) : 0;

            document.getElementById('progress-text').textContent = `${done} of ${total} completed`;
            document.getElementById('progress-percent').textContent = `${percent}%`;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        // Filter stories by category
        function filterStories(category) {
            const sections = document.querySelectorAll('#stories-container section');
            sections.forEach(section => {
                if (category === 'all' || section.dataset.category === category) {
                    section.style.display = 'block';
                } else {
                    section.style.display = 'none';
                }
            });

            // Update button styles
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-brand-600', 'text-white');
                btn.classList.add('bg-white', 'text-slate-600', 'border', 'border-slate-200');
            });
            const activeBtn = document.getElementById(`filter-${category}`);
            activeBtn.classList.remove('bg-white', 'text-slate-600', 'border', 'border-slate-200');
            activeBtn.classList.add('bg-brand-600', 'text-white');
        }

        // Reset all checkboxes
        function resetAll() {
            if (confirm('Are you sure you want to reset all checkboxes?')) {
                document.querySelectorAll('.story-checkbox').forEach(cb => {
                    cb.checked = false;
                });
                localStorage.removeItem(STORAGE_KEY);
                updateProgress();
            }
        }

        // Initialize
        loadState();
    </script>
</body>
</html>
